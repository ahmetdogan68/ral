<script>
let JCM_KAYITLAR = JSON.parse(localStorage.getItem('jotun_kayitlar_v2') || '[]');

function parseJCM(text){
  text = text.trim().replace(/\s+/g,' ').trim();
  let o = {ral_no:'', ral_isim:'', product:'', base_no:'', formul:'', can_size:'20L', colorant_cost:'0', tarih:new Date().toLocaleString('tr-TR'), raw_json:text};
  
  // A) Bookmarklet'ten gelen temiz format: RAL | ÜRÜN | BASE | FORMÜL | AMBALAJ | MALİYET
  if(text.includes('|')){
    let p = text.split('|').map(s=>s.trim()).filter(s=>s);
    // p[0]=7016 ANTHRAZITGRAU RAL 840HR  p[1]=FUTURA CLASSIC p[2]=3 p[3]=BL006... p[4]=20L p[5]=20.37
    if(p[0]){
      let m = p[0].match(/(\d{4})\s*(.*)/);
      if(m){ o.ral_no=m[1]; o.ral_isim=m[2].replace(/RAL.*$/i,'').trim(); }
    }
    o.product = (p[1]||'FUTURA CLASSIC').trim();
    o.base_no = (p[2]||'').replace(/[^1-3]/g,'').trim();
    // FORMÜLÜ Can size'den ÖNCE KES - İŞTE HATA BURADAYDI
    o.formul = (p[3]||'').split(/Can size/i)[0].split(/Price details/i)[0].trim();
    o.can_size = (p[4]||'20L').replace(/[^0-9\.]/g,'') ? (p[4].match(/3\.6|5|18|20/)||['20'])[0]+'L' : '20L';
    o.colorant_cost = (p[5]||'0').replace(/[^0-9\.]/g,'');
    return o;
  }
  
  // B) Ham JCM kopyala-yapıştır
  let mRal = text.match(/(\d{4})/); if(mRal) o.ral_no=mRal[1];
  let mIsim = text.match(/\d{4}\s+([A-Z ]+?)\s+RAL/i); if(mIsim) o.ral_isim=mIsim[1].trim();
  let mProd = text.match(/FUTURA CLASSIC|PILOT QD TOPCOAT|CONSEAL TU/i); if(mProd) o.product=mProd[0];
  // BASE'i ürünün yanından al, adım numarası 2 değil
  let mBase = text.match(/\b([1-3])\s+(?:FUTURA|PILOT|CONSEAL)|BASE\s*([1-3])/i);
  if(mBase) o.base_no = (mBase[1]||mBase[2]||'').trim();
  let mForm = text.match(/(BL\d+[^\n]*?WT\d+\.\d+|WB\d+[^\n]*?WT\d+\.\d+)/i);
  if(mForm) o.formul = mForm[1].split(/Can size/i)[0].trim();
  let mCan = text.match(/(3\.6|5|18|20)\s*L/i); if(mCan) o.can_size=mCan[1]+'L';
  let mCost = text.match(/Colorant cost:\s*([\d\.]+)/i); if(mCost) o.colorant_cost=mCost[1];
  
  return o;
}

function kaydetSisteme(){
  let input = document.getElementById('jcmInput');
  let txt = input ? input.value : '';
  if(!txt.trim()){ alert('Önce yapıştır abi'); return; }
  
  let yeni = parseJCM(txt);
  if(!yeni.ral_no){ alert('RAL no bulunamadı'); return; }
  if(!yeni.base_no){ yeni.base_no='1'; } // boşsa 1 yapma, sor
  if(!yeni.formul){ alert('Formül bulunamadı: '+txt.substring(0,100)); return; }

  // YENİ ANAHTAR: RAL + BASE + CAN + ÜRÜN - AYNI RAL FARKLI BASE İSE YENİ KAYIT
  let key = `${yeni.ral_no}_${yeni.base_no}_${yeni.can_size}_${yeni.product}`;
  let idx = JCM_KAYITLAR.findIndex(k=> `${k.ral_no}_${k.base_no}_${k.can_size}_${k.product}` === key);
  
  if(idx>=0){
    // Aynı kombinasyon varsa güncelle (formül değişmiş olabilir)
    JCM_KAYITLAR[idx] = {...JCM_KAYITLAR[idx], ...yeni};
    console.log('GÜNCELLENDİ:', key);
  }else{
    // Farklı BASE veya ambalaj ise YENİ KAYIT OLUŞTUR - ÜSTÜNE YAZMA
    JCM_KAYITLAR.push(yeni);
    console.log('YENİ KAYIT OLUŞTURULDU:', key);
  }
  
  localStorage.setItem('jotun_kayitlar_v2', JSON.stringify(JCM_KAYITLAR));
  localStorage.setItem('jotun_kayitlar', JSON.stringify(JCM_KAYITLAR)); // baydemir için ikisi de
  
  document.getElementById('kayitSayisi').innerText = `Toplam: ${JCM_KAYITLAR.length}`;
  listeyiGoster();
  input.value='';
  
  // Üstteki küçük kutuları doldur (senin resimdeki 7016 / FUTURA C / BASE / 20L / 20.37)
  let elRal=document.querySelector('#ralKutu'); if(elRal) elRal.value=yeni.ral_no;
  let elProd=document.querySelector('#urunKutu'); if(elProd) elProd.value=yeni.product;
  let elBase=document.querySelector('#baseKutu'); if(elBase) elBase.value=yeni.base_no;
  let elCan=document.querySelector('#canKutu'); if(elCan) elCan.value=yeni.can_size;
  let elCost=document.querySelector('#costKutu'); if(elCost) elCost.value=yeni.colorant_cost;
}

function listeyiGoster(){
  let alan = document.getElementById('kayitListesi');
  if(!alan) return;
  alan.innerHTML = JCM_KAYITLAR.map((k,i)=>`
    <div style="border:1px solid #fc0; padding:6px; margin:4px 0; border-radius:8px; background:white; font-size:11px">
      <b>RAL ${k.ral_no}</b> | ${k.product} BASE ${k.base_no} | ${k.can_size} | $${k.colorant_cost}
      <br><small>${k.formul}</small>
      <button onclick="kayitSil(${i})" style="float:right; background:#ff4444; color:white; border:none; border-radius:6px; padding:2px 8px">X</button>
    </div>
  `).join('') + `<div style="margin-top:8px; font-weight:900">Toplam: ${JCM_KAYITLAR.length}</div>`;
}

function kayitSil(i){ JCM_KAYITLAR.splice(i,1); localStorage.setItem('jotun_kayitlar_v2', JSON.stringify(JCM_KAYITLAR)); listeyiGoster(); }
window.addEventListener('load', ()=>{ listeyiGoster(); });
</script>
