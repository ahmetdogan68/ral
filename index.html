<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JCM OTOMATİK - YAPIŞTIR 5SN'DE KAYDET</title>
<style>
body{font-family:Arial; background:#fef9e7; margin:10px}
.kutu{border:2px dashed #fc0; border-radius:12px; padding:10px; background:#ffffe0}
.input1{width:100%; padding:12px; border-radius:8px; border:2px solid #012060; font-size:13px; box-sizing:border-box}
.mini{padding:8px; border-radius:8px; border:2px solid #012060; font-weight:900; text-align:center}
.btnYesil{width:100%; padding:14px; background:#0a7a2f; color:white; border:none; border-radius:10px; font-weight:900; font-size:14px; cursor:pointer; margin-top:8px}
.kayit{border:1px solid #fc0; background:white; padding:8px; margin:6px 0; border-radius:8px; font-size:12px}
</style>
</head>
<body>

<div class="kutu">
  <div style="font-weight:900; color:#012060; margin-bottom:8px">🟡 JCM OTOMATİK - YAPIŞTIR 5SN'DE KAYDEDER</div>
  <div style="font-size:10px; background:#012060; color:white; padding:6px; border-radius:6px; margin-bottom:8px">
    Format: RAL DOKU | ÜRÜN ADI | BASE | FORMÜL | AMBALAJ | MALİYET<br>
    Örn: 9010 PURE WHITE RAL 840HR | FUTURA CLASSIC | 1 | WB001.9 YX001.1 | 20L | 0.39
  </div>

  <input id="jcmInput" class="input1" placeholder="JCM'den KOPYALA yapıştır - otomatik çözer" oninput="onYapistir()">

  <div style="display:grid; grid-template-columns:1fr 100px 80px; gap:6px; margin-top:8px">
    <div style="display:flex; gap:6px">
      <input id="ralKutu" class="mini" style="flex:1" placeholder="RAL">
      <input id="urunKutu" class="mini" style="flex:2" placeholder="ÜRÜN">
      <select id="baseKutu" class="mini"><option value="">BASE</option><option value="1">BASE 1</option><option value="2">BASE 2</option><option value="3">BASE 3</option></select>
    </div>
    <div style="display:flex; gap:6px">
      <select id="canKutu" class="mini"><option value="20L">20L</option><option value="18L">18L</option><option value="5L">5L</option><option value="3.6L">3.6L</option></select>
      <input id="costKutu" class="mini" placeholder="MALİYET">
    </div>
  </div>

  <div id="onizleme" style="margin-top:8px; border:1.5px dashed #0a7a2f; background:#e6ffe6; padding:8px; border-radius:8px; font-size:11px; display:none"></div>

  <button class="btnYesil" onclick="kaydetSisteme()">✅ KAYDET SİSTEME</button>
  <button onclick="tumunuSil()" style="margin-top:6px; width:100%; padding:8px; background:#ff4444; color:white; border:none; border-radius:8px">🗑️ TÜMÜNÜ SİL</button>

  <div style="margin-top:10px; display:flex; gap:6px">
    <button onclick="exportJSON()" style="flex:1; padding:8px; background:#012060; color:white; border:none; border-radius:8px; font-size:11px">📋 GitHub için JSON KOPYALA</button>
    <span id="kayitSayisi" style="padding:8px; font-weight:900">Toplam: 0</span>
  </div>

  <div id="kayitListesi" style="margin-top:10px"></div>
</div>

<script>
let JCM_KAYITLAR = JSON.parse(localStorage.getItem('jotun_kayitlar_v2') || localStorage.getItem('jotun_kayitlar') || '[]');

function parseJCM(text){
  text = text.trim().replace(/\s+/g,' ').trim();
  let o = {ral_no:'', ral_isim:'', product:'FUTURA CLASSIC', base_no:'', formul:'', can_size:'20L', colorant_cost:'0', tarih:new Date().toLocaleString('tr-TR'), raw_json:text};
  if(!text) return o;

  if(text.includes('|')){
    let p = text.split('|').map(s=>s.trim()).filter(s=>s);
    if(p[0]){
      let m = p[0].match(/(\d{4})\s*(.*)/);
      if(m){ o.ral_no=m[1]; o.ral_isim=m[2].replace(/RAL.*$/i,'').trim(); }
      else { let m2=text.match(/(\d{4})/); if(m2) o.ral_no=m2[1]; }
    }
    o.product = (p[1]||'FUTURA CLASSIC').trim();
    o.base_no = (p[2]||'').replace(/[^1-3]/g,'').trim();
    o.formul = (p[3]||'').split(/Can size/i)[0].split(/Price details/i)[0].trim();
    let canM = (p[4]||'').match(/3\.6|18|20|5/); o.can_size = canM ? canM[0]+'L' : '20L';
    o.colorant_cost = (p[5]||'0').replace(/[^0-9\.]/g,'');
    return o;
  }

  let mRal = text.match(/(\d{4})/); if(mRal) o.ral_no=mRal[1];
  let mIsim = text.match(/\d{4}\s+([A-Z ]+?)\s+RAL/i); if(mIsim) o.ral_isim=mIsim[1].trim();
  let mProd = text.match(/CONSEAL TU|PILOT QD TOPCOAT|FUTURA CLASSIC/i); if(mProd) o.product=mProd[0];
  let mBase = text.match(/\b([1-3])\s+(?:FUTURA|PILOT|CONSEAL)|BASE\s*([1-3])/i); if(mBase) o.base_no=(mBase[1]||mBase[2]||'').trim();
  let mForm = text.match(/(BL\d+[^\n]*?WT\d+\.\d+|WB\d+[^\n]*?WT\d+\.\d+)/i); if(mForm) o.formul=mForm[1].split(/Can size/i)[0].trim();
  let mCan = text.match(/(3\.6|5|18|20)\s*L/i); if(mCan) o.can_size=mCan[1]+'L';
  let mCost = text.match(/Colorant cost:\s*([\d\.]+)/i); if(mCost) o.colorant_cost=mCost[1];
  return o;
}

function onYapistir(){
  let txt = document.getElementById('jcmInput').value;
  if(txt.length<10) return;
  let o = parseJCM(txt);
  document.getElementById('ralKutu').value = o.ral_no;
  document.getElementById('urunKutu').value = o.product;
  document.getElementById('baseKutu').value = o.base_no;
  document.getElementById('canKutu').value = o.can_size;
  document.getElementById('costKutu').value = o.colorant_cost;
  let pre = document.getElementById('onizleme');
  if(o.ral_no && o.formul){
    pre.style.display='block';
    pre.innerHTML = `OTOMATİK ÇÖZÜLDÜ:<br><b>RAL ${o.ral_no}</b> ${o.ral_isim} | ${o.product} | BASE ${o.base_no} | ${o.can_size} | $${o.colorant_cost}<br><small>${o.formul}</small>`;
  }
}

function kaydetSisteme(){
  let txt = document.getElementById('jcmInput').value.trim();
  // kutulardan da alabilir - elle düzeltme için
  let yeni = parseJCM(txt || `${document.getElementById('ralKutu').value} | ${document.getElementById('urunKutu').value} | ${document.getElementById('baseKutu').value} | ${document.getElementById('onizleme').innerText} | ${document.getElementById('canKutu').value} | ${document.getElementById('costKutu').value}`);
  
  // kutulardan override
  yeni.ral_no = document.getElementById('ralKutu').value.trim() || yeni.ral_no;
  yeni.product = document.getElementById('urunKutu').value.trim() || yeni.product;
  yeni.base_no = document.getElementById('baseKutu').value.trim() || yeni.base_no;
  yeni.can_size = document.getElementById('canKutu').value.trim() || yeni.can_size;
  yeni.colorant_cost = document.getElementById('costKutu').value.trim() || yeni.colorant_cost;

  if(!yeni.ral_no){ alert('RAL no yok'); return; }
  if(!yeni.base_no){ alert('BASE seç'); return; }
  if(!yeni.formul){ 
    // onizlemeden al
    let preTxt = document.getElementById('onizleme').innerText;
    let m = preTxt.match(/(BL.*|WB.*)/i);
    if(m) yeni.formul=m[1];
  }
  if(!yeni.formul){ alert('Formül yok'); return; }

  let key = `${yeni.ral_no}_${yeni.base_no}_${yeni.can_size}_${yeni.product}`.toUpperCase();
  let idx = JCM_KAYITLAR.findIndex(k=> `${k.ral_no}_${k.base_no}_${k.can_size}_${k.product}`.toUpperCase() === key);

  if(idx>=0){
    JCM_KAYITLAR[idx] = {...JCM_KAYITLAR[idx], ...yeni};
  }else{
    JCM_KAYITLAR.push(yeni);
  }

  localStorage.setItem('jotun_kayitlar_v2', JSON.stringify(JCM_KAYITLAR));
  localStorage.setItem('jotun_kayitlar', JSON.stringify(JCM_KAYITLAR));

  document.getElementById('jcmInput').value='';
  document.getElementById('onizleme').style.display='none';
  listeyiGoster();
}

function listeyiGoster(){
  let alan = document.getElementById('kayitListesi');
  let say = document.getElementById('kayitSayisi');
  if(say) say.innerText = `Toplam: ${JCM_KAYITLAR.length}`;
  if(!alan) return;
  alan.innerHTML = JCM_KAYITLAR.slice().reverse().map((k,i)=>{
    let realIdx = JCM_KAYITLAR.length-1-i;
    return `<div class="kayit">
      <b>RAL ${k.ral_no}</b> | ${k.product} | BASE ${k.base_no} | ${k.can_size} | $${k.colorant_cost}
      <br><small>${k.formul}</small>
      <button onclick="kayitSil(${realIdx})" style="float:right; background:#ff4444; color:white; border:none; border-radius:6px; padding:2px 8px">X</button>
    </div>`;
  }).join('');
}

function kayitSil(i){ if(!confirm('Silinsin mi?')) return; JCM_KAYITLAR.splice(i,1); localStorage.setItem('jotun_kayitlar_v2', JSON.stringify(JCM_KAYITLAR)); localStorage.setItem('jotun_kayitlar', JSON.stringify(JCM_KAYITLAR)); listeyiGoster(); }
function tumunuSil(){ if(!confirm('TÜMÜ silinsin mi?')) return; JCM_KAYITLAR=[]; localStorage.removeItem('jotun_kayitlar_v2'); localStorage.removeItem('jotun_kayitlar'); listeyiGoster(); }
function exportJSON(){ navigator.clipboard.writeText(JSON.stringify(JCM_KAYITLAR,null,2)); alert('JSON kopyalandı - GitHub jotun_kayitlar.json içine yapıştır'); }

window.addEventListener('load', ()=>{ listeyiGoster(); });
</script>
</body>
</html>
